<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Штука — раннер с AI-камерой</title>
  <link rel="stylesheet" href="style.css?v=2">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui">
    <div id="score">0</div>

    <div id="menu" class="screen">
      <h1>ШТУКА</h1>
      <p class="subtitle">Сфоткай что угодно — и оно побежит</p>
      <div id="characters"></div>
      <button id="playBtn" class="primary">Играть</button>
      <button id="scanBtn" class="secondary">📸 Сканировать предмет</button>
      <p class="hint">Тап — прыжок · Свайп вниз — подкат · Долгое нажатие на персонажа — удалить</p>
    </div>

    <div id="gameover" class="screen hidden">
      <h2>Игра окончена</h2>
      <p class="big">Счёт: <span id="finalScore">0</span></p>
      <p class="dim">Рекорд: <span id="bestScore">0</span></p>
      <div class="row">
        <button id="retryBtn" class="primary">Ещё раз</button>
        <button id="shareBtn" class="secondary">Поделиться</button>
      </div>
      <button id="menuBtn" class="ghost">В меню</button>
    </div>
  </div>

  <div id="scanner" class="scanner hidden">
    <video id="cam" playsinline autoplay muted></video>
    <div class="scanner-frame"></div>
    <div class="scanner-info" id="scannerInfo">Наведи на предмет</div>
    <div class="scanner-controls">
      <button id="cancelScan" class="ghost">Отмена</button>
      <button id="snapBtn" class="primary">Снять</button>
    </div>
    <p class="scanner-privacy">Кадры обрабатываются на устройстве и никуда не отправляются</p>
  </div>

  <script src="game.js?v=2"></script>
  <script src="scanner.js?v=2"></script>
</body>
</html>
